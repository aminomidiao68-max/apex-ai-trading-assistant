services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - apex_pip_cache:/root/.cache/pip
    ports:
      - "3000:8000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
      - CORS_ALLOWED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    restart: unless-stopped

volumes:
  apex_pip_cache:
